<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're Offline — MakanOnRent</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0A1A14" />
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="assets/css/home.css">
</head>
<body>

<header class="site-head page-head">
  <div class="container head-inner">
    <a class="brand" href="index.html" aria-label="MakanOnRent home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V20h14V9.8"/><path d="M10 20v-5.5h4V20"/></svg>
      </span>
      <span class="brand-text"><b>MakanOnRent</b><span>Verified Rentals</span></span>
    </a>
  </div>
</header>

<!-- Shown only by the service worker, and only when a navigation could not
     reach the network at all. Property data is never served from a cache,
     so this page promises nothing it cannot deliver: it says the
     connection is gone, not that listings are unavailable. -->
<main style="min-height:60vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:60px 24px;">
  <div class="container" style="max-width:520px;">
    <h1 style="font-family:var(--font-serif); font-size:clamp(28px,5vw,42px); color:var(--ink); margin-bottom:12px;">You're offline</h1>
    <p style="color:var(--muted); font-size:15px; margin-bottom:28px;">
      MakanOnRent needs a connection to show verified listings. Reconnect and try again.
    </p>
    <button class="btn-gold" type="button" id="retry" style="display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      Try again
    </button>
  </div>
</main>

<footer class="site-foot">
  <div class="container foot-inner">
    <p>&copy; <b>MakanOnRent</b> — Pakistan's verified rental platform.</p>
  </div>
</footer>

<script src="assets/js/offline.js"></script>
</body>
</html>
