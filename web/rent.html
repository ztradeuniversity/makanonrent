<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Properties for Rent — MakanOnRent</title>
<meta name="description" content="Browse verified properties for rent across Pakistan. Rent, advance and verification status shown up front." />
<meta name="theme-color" content="#0A1A14" />
<link rel="stylesheet" href="assets/css/home.css">
<link rel="stylesheet" href="assets/css/listing.css">
<link rel="stylesheet" href="assets/css/location-search.css">
</head>
<body>

<header class="site-head page-head">
  <div class="container head-inner">
    <a class="brand" href="index.html" aria-label="MakanOnRent home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V20h14V9.8"/><path d="M10 20v-5.5h4V20"/></svg>
      </span>
      <span class="brand-text"><b>MakanOnRent</b><span>Verified Rentals</span></span>
    </a>
    <div class="head-right">
      <a class="back-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        New Search
      </a>
      <a class="btn-gold head-cta" href="submit.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Submit Property
      </a>
    </div>
  </div>
</header>

<!-- ══ FILTERS ══ -->
<section class="filter-bar">
  <div class="container">
    <form class="filter-row" id="filterForm" novalidate>
      <div class="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        <select id="fCity" aria-label="City"><option value="">All cities</option></select>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <div class="loc-wrap">
        <div class="control loc-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input type="text" id="fArea" autocomplete="off" placeholder="Society, phase, block…"
                 role="combobox" aria-expanded="false" aria-autocomplete="list" aria-label="Location" />
          <button type="button" class="loc-clear" hidden aria-label="Clear location">&times;</button>
        </div>
        <div class="loc-panel" role="listbox" hidden></div>
      </div>

      <div class="control">
        <span class="prefix">PKR</span>
        <input id="fBudget" type="text" inputmode="numeric" autocomplete="off" placeholder="Max budget" aria-label="Maximum budget" />
      </div>

      <div class="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V20h14V9.8"/></svg>
        <select id="fType" aria-label="Property type">
          <option value="">All types</option>
          <option value="house">House</option>
          <option value="flat">Flat</option>
          <option value="portion">Portion</option>
          <option value="office">Office</option>
          <option value="shop">Shop</option>
          <option value="room">Room</option>
          <option value="other">Other</option>
        </select>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <button class="btn-apply" type="submit">Apply Filters</button>
    </form>
  </div>
</section>

<!-- ══ RESULTS ══ -->
<main class="results">
  <div class="container">
    <div class="toolbar">
      <div>
        <h1 id="resTitle">Properties for Rent</h1>
        <span class="count" id="resCount" aria-live="polite"></span>
      </div>
      <div class="toolbar-right">
        <div class="sort-wrap">
          <div class="control">
            <select id="fSort" aria-label="Sort results">
              <option value="recent">Newest first</option>
              <option value="low">Rent: low to high</option>
              <option value="high">Rent: high to low</option>
            </select>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
        <div class="view-toggle" role="group" aria-label="View mode">
          <button type="button" data-view="grid" aria-pressed="true" aria-label="Grid view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
          </button>
          <button type="button" data-view="list" aria-pressed="false" aria-label="List view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="5" rx="1.6"/><rect x="3" y="14.5" width="18" height="5" rx="1.6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="bannerSlot"></div>
    <div class="cards is-grid" id="cards" aria-busy="true"></div>
    <nav class="pager" id="pager" aria-label="Results pages"></nav>
  </div>
</main>

<footer class="site-foot">
  <div class="container foot-inner">
    <p>&copy; <span id="yr"></span> <b>MakanOnRent</b> — Pakistan's verified rental platform.</p>
    <p>Listings verified on site. Availability confirmed.</p>
  </div>
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/pk-locations.js"></script>
<script src="assets/js/location-engine.js"></script>
<script src="assets/js/location-fixture.js"></script>
<script src="assets/js/location-sample-subareas.js"></script>
<script src="assets/js/location-bank.js"></script>
<script src="assets/js/property-data.js"></script>
<script src="assets/js/shared.js"></script>
<script src="assets/js/location-search.js"></script>
<script src="assets/js/listing.js"></script>
</body>
</html>
