# MakanOnRent — Cloudflare Pages project config.
# Used for local development (`npm run dev` → wrangler pages dev) and to
# document the Functions runtime. Production env vars/secrets are set in
# the Cloudflare dashboard (Pages project → Settings → Environment
# variables), NOT in this file — never put real values here.

name = "makanonrent"
pages_build_output_dir = "web"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Required environment variables/secrets (see .env.example for the full
# list with descriptions): SUPABASE_URL, SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY, R2_ACCOUNT_ID, R2_BUCKET_NAME,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_PUBLIC_BASE_URL, SITE_URL.

# Optional, more secure alternative to R2_ACCESS_KEY_ID/SECRET for the
# upload service: an R2 bucket binding needs no key material at all.
# Uncomment and configure the same binding in the Pages dashboard
# (Settings → Functions → R2 bucket bindings) to use it; the upload
# service in functions/utils/r2.js falls back to it automatically when
# an env.R2_BUCKET binding is present. Not required — the S3-compatible
# credentials above work standalone.
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "makanonrent-assets"

# Scheduler: Cloudflare Pages Functions have no scheduled() entrypoint
# (Workers-only), so this block does not invoke functions/api/admin/
# email-worker.js by itself. A companion Worker (or any external cron
# service) must call that endpoint on this interval instead.
[triggers]
crons = ["*/15 * * * *"]
